name: roboshop
services:
  mongodb:
    image: gcloudtechie/mongodb:1.0.0
    container_name: mongodb
    volumes:
    - mongodb:/data/db

  catalogue:
    image: gcloudtechie/catalogue:1.0.0
    container_name: catalogue
    depends_on:
    - mongodb

  frontend:
    image: gcloudtechie/frontend:1.0.0
    container_name: frontend
    ports:
    - "80:80"
    depends_on:
    - catalogue
    - user
    - cart
    - shipping
    - payment

  user:
    image: gcloudtechie/user:1.0.0
    container_name: user
    environment:
      MONGO: true
      REDIS_URL: 'redis://redis:6379'
      MONGO_URL: "mongodb://mongodb:27017/users"
    depends_on:
    - redis
    - mongodb

  cart:
    image: gcloudtechie/cart:1.0.0
    container_name: cart
    environment:
      REDIS_HOST: redis
      CATALOGUE_HOST: catalogue
      CATALOGUE_PORT: 8080
    depends_on:
    - redis
    - catalogue

  shipping:
    image: gcloudtechie/shipping:1.0.0
    container_name: shipping
    environment:
      CART_ENDPOINT: "cart:8080"
      DB_HOST: mysql
    depends_on:
    - mysql
    - cart

  payment:
    image: gcloudtechie/payment:1.0.0
    container_name: payment
    environment:
      CART_HOST: "cart"
      CART_PORT: 8080
      USER_HOST: user
      USER_PORT: 8080
      AMQP_HOST: rabbitmq
      AMQP_USER: roboshop
      AMQP_PASS: roboshop123
    depends_on:
    - cart
    - user
    - rabbitmq

  redis:
    image: redis:7
    container_name: redis
    volumes:
    - redis:/data

  mysql:
    image: gcloudtechie/mysql:1.0.0
    container_name: mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: "RoboShop@1"
    volumes:
    - mysql:/var/lib/mysql

  rabbitmq:
    image: rabbitmq:3
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: roboshop
      RABBITMQ_DEFAULT_PASS: roboshop123
    volumes:
    - rabbitmq:/var/lib/rabbitmq

networks:
  default:
    name: roboshop
    driver: bridge
    external: false

volumes:
  mongodb:
  redis:
  mysql:
  rabbitmq:
